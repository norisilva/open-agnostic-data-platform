# =============================================================================
# cell-router — application.properties
# 12-Factor App: ALL runtime config is driven by environment variables.
# This file defines DEFAULTS for %dev (local) and documents what env vars
# each property maps to for %prod.
# =============================================================================

# --- HTTP ---
quarkus.http.port=${PORT:8080}

# --- Logging ---
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.platform".level=${PLATFORM_LOG_LEVEL:DEBUG}

# --- Redis (Schema Cache) ---
# Env var: REDIS_URL
# Prod example: redis://redis.internal:6379
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# --- AWS SNS ---
# Env var: AWS_REGION, AWS_ENDPOINT_URL (LocalStack override — omit in prod)
quarkus.sns.region=${AWS_REGION:us-east-1}
%dev.quarkus.sns.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}

# AWS credentials: in prod use IAM roles (no static credentials needed).
# In dev/LocalStack use env vars: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
%dev.quarkus.sns.credentials.type=static
%dev.quarkus.sns.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
%dev.quarkus.sns.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# --- Apicurio Registry ---
# Env var: APICURIO_URL
# Prod example: http://apicurio.platform.svc.cluster.local:8081
quarkus.rest-client.apicurio.url=${APICURIO_URL:http://localhost:8081}

# --- OpenTelemetry ---
# Env var: OTEL_EXPORTER_OTLP_ENDPOINT
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:cell-router}

# --- Platform-specific ---
# Env var: PLATFORM_CELLS_ACTIVE (comma-separated list)
platform.cells.active=${PLATFORM_CELLS_ACTIVE:renegotiation-cell-a,loan-cell-b}

# SNS Topic ARN pattern — use %s as placeholder for the cell/group name.
# Env var: PLATFORM_SNS_TOPIC_ARN_PATTERN
# Prod example: arn:aws:sns:us-east-1:123456789012:%s-events
platform.sns.topic-arn-pattern=${PLATFORM_SNS_TOPIC_ARN_PATTERN:arn:aws:sns:us-east-1:000000000000:%s-events}

# Schema cache TTL in seconds.
# Env var: PLATFORM_SCHEMA_CACHE_TTL_SECONDS
platform.schema.cache-ttl-seconds=${PLATFORM_SCHEMA_CACHE_TTL_SECONDS:300}

