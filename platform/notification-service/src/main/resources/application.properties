# =============================================================================
# platform/notification-service — application.properties
# Generic notification dispatcher — agnostic to any business domain.
# Rule #27: NO domain names in config keys or values.
# Rule #26: ALL config from env vars (12-Factor III).
# Rule #25: Virtual Threads enabled.
# =============================================================================

# --- HTTP ---
quarkus.http.port=${PORT:8081}

# --- Logging ---
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.platform".level=${PLATFORM_LOG_LEVEL:DEBUG}

# --- Database ---
# Env vars: DB_URL, DB_USER, DB_PASS
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/platform_db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- SMTP / Mailer ---
# Dev: Mailpit (local SMTP trap)
# Prod: AWS SES — configure SMTP credentials via env vars
# Env vars: QUARKUS_MAILER_FROM, QUARKUS_MAILER_HOST, QUARKUS_MAILER_PORT,
#           QUARKUS_MAILER_USERNAME, QUARKUS_MAILER_PASSWORD
quarkus.mailer.from=${MAILER_FROM:platform@localhost}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=${MAILER_START_TLS:DISABLED}
quarkus.mailer.auth-methods=${MAILER_AUTH_METHODS:PLAIN}
# In prod (SES): set MAILER_HOST=email-smtp.us-east-1.amazonaws.com, MAILER_PORT=587

# --- AWS SQS (Generic consumer) ---
# Env var: AWS_REGION
quarkus.sqs.region=${AWS_REGION:us-east-1}
%dev.quarkus.sqs.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}
%dev.quarkus.sqs.credentials.type=static
%dev.quarkus.sqs.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
%dev.quarkus.sqs.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# Notification input queue URL.
# Env var: NOTIFICATION_QUEUE_URL
platform.notification.queue-url=${NOTIFICATION_QUEUE_URL:http://localhost:4566/000000000000/notification-queue}

# Number of concurrent virtual thread pollers.
# Env var: NOTIFICATION_CONSUMER_CONCURRENCY
platform.notification.concurrency=${NOTIFICATION_CONSUMER_CONCURRENCY:5}

# --- Observability ---
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:notification-service}

# --- Virtual Threads (Rule #25) ---
quarkus.virtual-threads.enabled=true
