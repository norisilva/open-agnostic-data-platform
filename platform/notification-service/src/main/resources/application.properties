# --- HTTP ---
quarkus.http.port=${PORT:8081}

# --- Logging ---
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.platform".level=${PLATFORM_LOG_LEVEL:DEBUG}

# --- Database ---
# Env vars: DB_URL, DB_USER, DB_PASS
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/platform_db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- SMTP / Mailer ---
# Dev: Mailpit (local SMTP trap)
# Prod: Configure SMTP credentials via env vars
quarkus.mailer.from=${MAILER_FROM:platform@localhost}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=${MAILER_START_TLS:DISABLED}
quarkus.mailer.auth-methods=${MAILER_AUTH_METHODS:PLAIN}


# RabbitMQ Config
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Incoming Channel
mp.messaging.incoming.notifications.connector=smallrye-rabbitmq
mp.messaging.incoming.notifications.queue.name=notification-queue
mp.messaging.incoming.notifications.exchange.name=platform.exchange
mp.messaging.incoming.notifications.routing-keys=notification.requested
# Number of concurrent virtual thread pollers.
# Env var: NOTIFICATION_CONSUMER_CONCURRENCY
platform.notification.concurrency=${NOTIFICATION_CONSUMER_CONCURRENCY:5}

# --- Observability ---
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:notification-service}

# --- Virtual Threads ---
quarkus.virtual-threads.enabled=true
