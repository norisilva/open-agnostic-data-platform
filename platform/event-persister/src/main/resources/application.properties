# =============================================================================
# platform/event-api — application.properties
# Generic event ingestion API — agnostic to any business domain.
# Rule #27: NO domain names (payment, renegotiation, etc.) anywhere.
# Rule #26: ALL config via env vars (12-Factor III).
# Rule #25: Virtual Threads enabled.
# =============================================================================

# --- HTTP ---
quarkus.http.port=${PORT:8080}

# --- Logging ---
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.platform".level=${PLATFORM_LOG_LEVEL:DEBUG}

# Database configs removed: persistence moved to event-persister

# --- Redis (Idempotency cache) ---
# Env var: REDIS_URL
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# Idempotency TTL in seconds (24h default).
# Env var: PLATFORM_IDEMPOTENCY_TTL_SECONDS
platform.idempotency.ttl-seconds=${PLATFORM_IDEMPOTENCY_TTL_SECONDS:86400}

# --- AWS SNS (Generic event publishing) ---
# Env var: AWS_REGION
quarkus.sns.region=${AWS_REGION:us-east-1}

# LocalStack endpoint — dev only. Omit in prod.
# Env var: AWS_ENDPOINT_URL
%dev.quarkus.sns.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}
%dev.quarkus.sns.credentials.type=static
%dev.quarkus.sns.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
%dev.quarkus.sns.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# SNS topic ARN pattern — %s will be replaced by cellId at runtime.
# Env var: PLATFORM_SNS_TOPIC_ARN_PATTERN
# Prod example: arn:aws:sns:us-east-1:123456789012:%s-events
platform.sns.topic-arn-pattern=${PLATFORM_SNS_TOPIC_ARN_PATTERN:arn:aws:sns:us-east-1:000000000000:%s-events}

# --- Observability ---
# Env var: OTEL_EXPORTER_OTLP_ENDPOINT
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:event-api}
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# --- Virtual Threads (Rule #25) ---
quarkus.virtual-threads.enabled=true
