# =============================================================================
# payment-api — application.properties
# Cell: renegotiation | Service: payment-api
# 12-Factor App: ALL runtime config is driven by environment variables.
# Agnostic: no hardcoded company names, ARNs, account IDs or passwords.
# =============================================================================

# --- HTTP ---
quarkus.http.port=${PORT:8080}

# --- Logging ---
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.platform".level=${PLATFORM_LOG_LEVEL:DEBUG}

# --- Database (Panache / Hibernate) ---
# Env vars: DB_URL, DB_USER, DB_PASS
# Prod: injected by Terraform task definition / Kubernetes secret
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/renegotiation_db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- Redis (Idempotency Cache) ---
# Env var: REDIS_URL
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# Idempotency key TTL in seconds (24h default)
# Env var: IDEMPOTENCY_TTL_SECONDS
cell.payment.idempotency-ttl-seconds=${IDEMPOTENCY_TTL_SECONDS:86400}

# --- AWS SNS (Event publishing) ---
# Env var: AWS_REGION
quarkus.sns.region=${AWS_REGION:us-east-1}

# LocalStack endpoint override — only in dev. Omit in prod (uses real AWS).
# Env var: AWS_ENDPOINT_URL
%dev.quarkus.sns.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}

# Dev credentials for LocalStack — in prod, use IAM roles (no static creds).
%dev.quarkus.sns.credentials.type=static
%dev.quarkus.sns.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
%dev.quarkus.sns.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# SNS Topic ARN for payment events.
# Env var: PAYMENT_EVENTS_TOPIC_ARN
# Prod example: arn:aws:sns:us-east-1:123456789012:renegotiation-payment-events
cell.payment.sns.topic-arn=${PAYMENT_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:renegotiation-payment-events}

# --- Observability ---
# Env var: OTEL_EXPORTER_OTLP_ENDPOINT
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:payment-api}
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# --- Virtual Threads ---
quarkus.virtual-threads.enabled=true
