apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'quarkus-apps'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['host.containers.internal:8080', 'host.containers.internal:8081']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-debezium-config
data:
  application.properties: |
    debezium.sink.type=rabbitmq
    debezium.sink.rabbitmq.connection.host=localhost
    debezium.sink.rabbitmq.connection.port=5672
    debezium.sink.rabbitmq.connection.username=guest
    debezium.sink.rabbitmq.connection.password=guest
    debezium.sink.rabbitmq.routingKey=platform.events
    debezium.sink.rabbitmq.exchange=platform.exchange
    debezium.sink.rabbitmq.deliveryMode=2

    debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
    debezium.source.offset.storage.file.filename=data/offsets.dat
    debezium.source.offset.flush.interval.ms=0
    debezium.source.database.hostname=localhost
    debezium.source.database.port=5432
    debezium.source.database.user=postgres
    debezium.source.database.password=postgres
    debezium.source.database.dbname=platformdb
    debezium.source.topic.prefix=platform
    debezium.source.table.include.list=public.command_outbox
    debezium.source.plugin.name=pgoutput
---
apiVersion: v1
kind: Pod
metadata:
  name: platform-infra
  labels:
    app: platform-infra
spec:
  containers:
    - name: apicurio-registry
      image: quay.io/apicurio/apicurio-registry:3.3.0
      ports:
        - containerPort: 8080
          hostPort: 8081

    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: platformdb
      args: ["-c", "wal_level=logical"]
      ports:
        - containerPort: 5432
          hostPort: 5432

    - name: rabbitmq
      image: rabbitmq:3-management-alpine
      env:
        - name: RABBITMQ_DEFAULT_USER
          value: guest
        - name: RABBITMQ_DEFAULT_PASS
          value: guest
      ports:
        - containerPort: 5672
          hostPort: 5672
        - containerPort: 15672
          hostPort: 15672

    - name: redis
      image: redis:alpine
      ports:
        - containerPort: 6379
          hostPort: 6379

    - name: mailpit
      image: axllent/mailpit
      ports:
        - containerPort: 1025
          hostPort: 1025
        - containerPort: 8025
          hostPort: 8025

    - name: prometheus
      image: prom/prometheus:v2.45.0
      ports:
        - containerPort: 9090
          hostPort: 9090
      volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml

    - name: grafana
      image: grafana/grafana:10.0.3
      ports:
        - containerPort: 3000
          hostPort: 3000
      env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Admin
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "true"

    - name: debezium-server
      image: quay.io/debezium/server:2.7
      volumeMounts:
        - name: debezium-config
          mountPath: /debezium/conf/application.properties
          subPath: application.properties

  volumes:
    - name: prometheus-config
      configMap:
        name: platform-prometheus-config
    - name: debezium-config
      configMap:
        name: platform-debezium-config
