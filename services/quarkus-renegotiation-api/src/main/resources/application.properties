# Default application.properties

quarkus.virtual-threads.enabled=true

# Database (Panache / Hibernate)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Observability
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://otel-collector:4317
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# Dev profile
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/renegotiation_db
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres

%dev.topic.renegotiation.arn=arn:aws:sns:us-east-1:000000000000:renegotiation-topic
%dev.quarkus.sns.endpoint-override=http://localhost:4566
%dev.quarkus.sns.aws.region=us-east-1
%dev.quarkus.sns.aws.credentials.type=static
%dev.quarkus.sns.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.sns.aws.credentials.static-provider.secret-access-key=test

%dev.quarkus.redis.hosts=redis://localhost:6379

# Prod profile
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASS}

%prod.topic.renegotiation.arn=${SNS_TOPIC_ARN}
%prod.quarkus.sns.aws.region=${AWS_REGION}

%prod.quarkus.redis.hosts=${REDIS_URL}
